
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Django static files (для DEBUG=True)
    location /static/ {
        proxy_pass http://backend:8000;
    }

    # Django API, admin и Swagger
    location ~ ^/(user|rooms|departments|specializations|diseases|drugs|doctors|patients|patient|doctor|schedule|appointments|medical-history|reports|api|api-auth|admin|swagger)(/|\.|$) {
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
